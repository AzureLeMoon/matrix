---
- name: Create aether directory
  ansible.builtin.file:
    path: /opt/aether
    state: directory
    mode: "0755"

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/aether/docker-compose.yml
    mode: "0644"

- name: Start Aether via docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/aether
    state: present   
