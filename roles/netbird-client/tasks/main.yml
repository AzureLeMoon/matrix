---
- name: Install prerequisite packages for Netbird
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Add Netbird GPG apt Key
  ansible.builtin.get_url:
    url: https://pkgs.netbird.io/{{ansible_distribution|lower}}/public.key
    dest: /usr/share/keyrings/netbird-archive-keyring.asc
    mode: '0644'

- name: Add Netbird APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.asc] https://pkgs.netbird.io/{{ansible_distribution|lower}} stable main"
    state: present
    filename: netbird

- name: Install Netbird
  ansible.builtin.apt:
    name: netbird
    state: present
    update_cache: yes

- name: Ensure Netbird service is started and enabled
  ansible.builtin.systemd:
    name: netbird
    state: started
    enabled: yes

- name: Check Netbird status
  ansible.builtin.command: netbird status
  register: netbird_status
  changed_when: false
  failed_when: false

- name: Bring Netbird up
  ansible.builtin.command: "netbird up --management-url https://{{ netbird_domain }} --setup-key {{ netbird_setup_key }}"
  when: "'NeedsLogin' in netbird_status.stdout or 'Disconnected' in netbird_status.stdout"
