---
- name: Create 9router directory
  ansible.builtin.file:
    path: /opt/9router
    state: directory
    mode: "0755"

- name: Create 9router data directory
  ansible.builtin.file:
    path: /opt/9router/data
    state: directory
    mode: "0755"

- name: Create searxng data directory
  ansible.builtin.file:
    path: /opt/9router/searxng-data
    state: directory
    mode: "0755"

- name: Create searxng config directory
  ansible.builtin.file:
    path: /opt/9router/searxng-config
    state: directory
    mode: "0755"

- name: Create valkey data directory
  ansible.builtin.file:
    path: /opt/9router/valkey-data
    state: directory
    mode: "0755"

- name: Copy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/9router/docker-compose.yml
    mode: "0644"

- name: Copy env file
  ansible.builtin.template:
    src: .env.j2
    dest: /opt/9router/.env
    mode: "0644"

- name: Copy searxng env file
  ansible.builtin.template:
    src: .env.searxng.j2
    dest: /opt/9router/.env.searxng
    mode: "0644"    

- name: Copy litestream.yml
  ansible.builtin.template:
    src: litestream.yml.j2
    dest: /opt/9router/litestream.yml
    mode: "0644"

- name: Start 9router via docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/9router
    state: present
